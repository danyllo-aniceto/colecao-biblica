services:
  postgres:
    image: postgres:16
    container_name: colecao_biblica_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: colecao_biblica
      POSTGRES_USER: colecao
      POSTGRES_PASSWORD: colecao
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
