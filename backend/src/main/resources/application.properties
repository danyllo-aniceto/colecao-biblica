spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

# Porta HTTP. A Vercel (container) injeta PORT; localmente fica 8080.
server.port=${PORT:8080}

# Banco: em produção defina DATABASE_URL (formato do Neon: postgresql://usuario:senha@host/banco?sslmode=require).
# Ela é convertida para JDBC por DatabaseUrlEnvironmentPostProcessor e sobrepõe os valores abaixo.
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:backend_db}
spring.datasource.username=${POSTGRES_USER:backend_user}
spring.datasource.password=${POSTGRES_PASSWORD:backend_pass}
# Poucas conexões por instância: várias instâncias podem subir ao mesmo tempo.
spring.datasource.hikari.maximum-pool-size=${DATABASE_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DATABASE_POOL_MIN_IDLE:0}
# O Neon pode "acordar" o banco no primeiro acesso: dá tempo para a conexão.
spring.datasource.hikari.connection-timeout=${DATABASE_CONNECTION_TIMEOUT_MS:30000}

app.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Origens liberadas no CORS (separadas por vírgula), ex.: https://colecao-biblica.vercel.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# Fuso usado para o limite diário de recompensas
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}

# Seed: contas de demonstração (admin2@email.com / user@email.com, senha 123456).
# Deixe false em produção.
app.seed.demo-users=${SEED_DEMO_USERS:true}
# Admin inicial de produção: criado no start se ainda não existir (deixe vazio para não criar).
app.seed.admin-email=${ADMIN_EMAIL:}
app.seed.admin-password=${ADMIN_PASSWORD:}
app.seed.admin-name=${ADMIN_NAME:Administrador}
