spring.application.name=backend
spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:backend_db}
spring.datasource.username=${POSTGRES_USER:backend_user}
spring.datasource.password=${POSTGRES_PASSWORD:backend_pass}
app.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# Origens liberadas no CORS (separadas por vírgula), ex.: https://colecao-biblica.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
# Fuso usado para o limite diário de recompensas
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
