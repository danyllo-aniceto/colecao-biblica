<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: 'Fredoka'; font-weight: 700; src: url('../../../node_modules/@fontsource/fredoka/files/fredoka-latin-700-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Fredoka'; font-weight: 600; src: url('../../../node_modules/@fontsource/fredoka/files/fredoka-latin-600-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 800; src: url('../../../node_modules/@fontsource/nunito/files/nunito-latin-800-normal.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; src: url('../../../node_modules/@fontsource/nunito/files/nunito-latin-700-normal.woff2') format('woff2'); }
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; font-family: 'Nunito', sans-serif; color: #fff;
    background: radial-gradient(circle at 18% 30%, #7a5cff 0%, rgba(122,92,255,0) 45%), radial-gradient(circle at 92% 90%, #19c4b0 0%, rgba(25,196,176,0) 42%), linear-gradient(135deg, #1d2a8c 0%, #4a2fbd 55%, #2d1d85 100%); position: relative; }
  .glow { position: absolute; left: 20px; top: 40px; width: 520px; height: 520px; border-radius: 50%; background: radial-gradient(circle, rgba(255,214,102,.55), rgba(255,214,102,0) 68%); }
  .logo { position: absolute; left: 70px; top: 36px; height: 560px; filter: drop-shadow(0 22px 28px rgba(0,0,0,.45)); }
  .right { position: absolute; left: 600px; top: 52px; width: 560px; }
  h1 { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 60px; line-height: 1.02; letter-spacing: -.5px; text-shadow: 0 4px 0 rgba(0,0,0,.18); }
  h1 span { color: #ffd23f; }
  .sub { margin-top: 10px; font-size: 24px; font-weight: 700; line-height: 1.3; color: #e6e9ff; }
  .modes { margin-top: 20px; display: grid; gap: 10px; }
  .mode { display: flex; align-items: center; gap: 16px; padding: 9px 16px; border-radius: 20px; background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.28); backdrop-filter: blur(4px); }
  .icon { flex: none; width: 46px; height: 46px; border-radius: 16px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 0 rgba(0,0,0,.22); }
  .icon svg { width: 28px; height: 28px; fill: #fff; }
  .t { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 25px; line-height: 1.05; }
  .d { font-size: 17px; font-weight: 700; color: #dfe3ff; margin-top: 2px; }
  .pill { position: absolute; right: 44px; bottom: 22px; padding: 10px 24px; border-radius: 999px; background: #ffd23f; color: #3a2400; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 27px; box-shadow: 0 5px 0 #d49a00; }
</style>
</head>
<body>
  <div class="glow"></div>
  <img class="logo" src="../../src/assets/logo-completa.png" alt="" />
  <div class="right">
    <h1>Aprenda a Bíblia <span>jogando!</span></h1>
    <p class="sub">Responda quizzes, colecione figurinhas dos personagens e jogue com os amigos.</p>
    <div class="modes">
      <div class="mode">
        <div class="icon" style="background:#ff6b6b"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm1 16h-2v-2h2v2zm2.1-7.8c-.6.9-1.3 1.3-1.8 1.8-.2.2-.3.5-.3.9v.3h-2v-.4c0-.8.3-1.4.9-2 .5-.5 1.1-.9 1.4-1.3.3-.4.2-1-.2-1.4-.5-.4-1.3-.4-1.8.1-.2.2-.3.5-.3.8H8c0-.9.4-1.7 1.1-2.3 1.4-1.2 3.7-1.2 5 .1.9.9 1.1 2.2.3 3.4z"/></svg></div>
        <div><div class="t">Quiz Bíblico</div><div class="d">Ganhe XP, moedas e baús de figurinhas</div></div>
      </div>
      <div class="mode">
        <div class="icon" style="background:#8b5cf6"><svg viewBox="0 0 24 24"><path d="M5 3h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2zm3.5 4.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm7 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-3.5 3.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm-3.5 3.5a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm7 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/></svg></div>
        <div><div class="t">Tabuleiro</div><div class="d">Dado e perguntas, de 2 a 6 amigos</div></div>
      </div>
      <div class="mode">
        <div class="icon" style="background:#14b8a6"><svg viewBox="0 0 24 24"><path d="M7 2h8a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V4a2 2 0 012-2zm13.5 3.2l-1.1.3v13.2c0 .6-.3 1.200-.8 1.500L16 21.800l3.800 1c1.100.3 2.200-.4 2.500-1.500l1.700-12.500c.2-1.100-.4-2.200-1.500-2.500z"/></svg></div>
        <div><div class="t">Duelo de Figurinhas</div><div class="d">Monte seu Time e vença as arenas</div></div>
      </div>
    </div>
  </div>
  <div class="pill">Jogue grátis!</div>
</body>
</html>
